version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      iced:
        patterns: ["iced*"]
    ignore:
      # Pinned to the exact version iced_term uses; it moves when iced_term does.
      - dependency-name: alacritty_terminal
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
