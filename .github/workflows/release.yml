name: release

# Push a tag like v0.2.0 to build Linux binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on older glibc too.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for iced
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
      # MIT and Apache-2.0 ask that a binary carries its dependencies' notices.
      - name: Third-party licenses
        run: cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Package
        run: |
          name="mira-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir "$name"
          cp target/release/mira assets/mira.desktop assets/mira.svg README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.html "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          python3 scripts/update-manifest.py "$name.tar.gz" target/release/mira "$GITHUB_REF_NAME" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mira-${{ matrix.arch }}
          path: |
            mira-*.tar.gz*
            mira-*.update.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Sign authenticated update metadata
        env:
          MIRA_UPDATE_SIGNING_KEY: ${{ secrets.MIRA_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$MIRA_UPDATE_SIGNING_KEY"
          printf '%s\n' "$MIRA_UPDATE_SIGNING_KEY" | sh scripts/sign-updates.sh
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            mira-*.tar.gz*
            mira-*.update.json*
          generate_release_notes: true
