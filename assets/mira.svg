<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>mira</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13303F"/>
      <stop offset="1" stop-color="#0A1822"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD3DE"/>
      <stop offset="1" stop-color="#12717C"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- eye: "¡mira!" (look) at what the agents did in the terminal -->
  <path d="M28 128 C66 64 190 64 228 128 C190 192 66 192 28 128 Z" fill="#EFF6F7"/>
  <circle cx="128" cy="128" r="50" fill="url(#iris)"/>
  <!-- the pupil is a prompt: >_ -->
  <path d="M106 106 L128 128 L106 150" fill="none" stroke="#0C1C28" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="134" y="142" width="24" height="11" rx="5.5" fill="#0C1C28"/>
</svg>
