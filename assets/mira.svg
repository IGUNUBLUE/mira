<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>mira</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BDCE6"/>
      <stop offset="1" stop-color="#0E6672"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16303E"/>
      <stop offset="1" stop-color="#08151E"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- ¡mira! Binoculars whose lenses are a diff: removed | added -->
  <g fill="url(#body)">
    <!-- eyepieces -->
    <rect x="62" y="40" width="40" height="30" rx="9"/>
    <rect x="154" y="40" width="40" height="30" rx="9"/>
    <!-- tubes, wider toward the lenses -->
    <path d="M60 64 H104 L126 130 H34 Z" stroke="url(#body)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M196 64 H152 L130 130 H222 Z" stroke="url(#body)" stroke-width="10" stroke-linejoin="round"/>
    <!-- hinge -->
    <rect x="98" y="92" width="60" height="58" rx="12"/>
    <!-- objectives -->
    <circle cx="78" cy="164" r="52"/>
    <circle cx="178" cy="164" r="52"/>
  </g>
  <!-- focus wheel -->
  <rect x="114" y="58" width="28" height="40" rx="7" fill="#24495A"/>
  <g stroke="#5BDCE6" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M121 66 V90"/><path d="M128 66 V90"/><path d="M135 66 V90"/>
  </g>
  <!-- lenses -->
  <circle cx="78" cy="164" r="37" fill="#FFD9D2"/>
  <circle cx="178" cy="164" r="37" fill="#CFF6E3"/>
  <rect x="58" y="156" width="40" height="16" rx="8" fill="#F06A5C"/>
  <rect x="158" y="156" width="40" height="16" rx="8" fill="#27B776"/>
  <rect x="170" y="144" width="16" height="40" rx="8" fill="#27B776"/>
  <!-- glints -->
  <path d="M54 146 A30 30 0 0 1 70 132" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"
        stroke-width="6" stroke-linecap="round"/>
  <path d="M154 146 A30 30 0 0 1 170 132" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"
        stroke-width="6" stroke-linecap="round"/>
</svg>
