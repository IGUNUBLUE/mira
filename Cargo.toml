[package]
name = "mira"
version = "0.2.0"
edition = "2024"
description = "A light, terminal-first workspace for reviewing what your coding agents change"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IGUNUBLUE/mira"
homepage = "https://github.com/IGUNUBLUE/mira"
keywords = ["agents", "git", "diff", "terminal", "review"]
categories = ["development-tools", "text-editors"]
exclude = ["/.agents", "/.kiro", "/.github", "/docs/images"]

[dependencies]
iced = { version = "0.14.0", features = ["highlighter", "tokio", "advanced", "lazy", "image-without-codecs", "svg"] }
# Image tabs: only the common formats are decoded (iced's `image` would enable them all).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
iced_term = "0.8.0"
# Same version iced_term uses; only for its event and grid types.
alacritty_terminal = "=0.25.1"
ignore = "0.4.33"
regex = "1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
similar = { version = "3.2.0", features = ["std", "text", "inline"] }
# `time`: the search debounce (iced's tokio executor already enables timers).
tokio = { version = "1", features = ["rt", "time"] }

[lints.rust]
# One documented exception: setting the renderer env var at the top of main.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Dev builds: line tables are enough for backtraces, and optimized
# dependencies (iced, wgpu, cosmic-text) keep the UI usable for latency checks.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Same version iced uses; only to check the gutter against the editor's real scrolling.
cosmic-text = "=0.15.0"
