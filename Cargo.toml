[package]
name = "mira"
version = "0.1.0"
edition = "2024"
description = "A lightweight, terminal-first code review workspace for agent-driven development"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["editor", "git", "diff", "terminal", "ide"]
categories = ["development-tools", "text-editors"]

[dependencies]
iced = { version = "0.14.0", features = ["highlighter", "tokio", "advanced"] }
iced_term = "0.8.0"
ignore = "0.4.33"
regex = "1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
similar = { version = "3.2.0", features = ["std", "text", "inline"] }
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
