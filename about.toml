# Licenses of mira's dependencies, bundled with release binaries as
# THIRD_PARTY_LICENSES.html (`cargo about generate about.hbs`).
# Order is preference: for "X OR Y" crates the first accepted license is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
